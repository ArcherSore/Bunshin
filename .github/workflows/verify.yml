name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check fixed waits in self-tests
        run: ./src/Gui/scripts/verify.ps1 -Suite FixedWait

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Setup Rust MSVC toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy

      - name: Build GUI and Worker, verify Worker
        run: ./src/Gui/scripts/verify.ps1 -Suite Worker

      - name: Verify Updater
        run: ./src/Gui/scripts/verify.ps1 -Suite Updater

      - name: Verify Engine
        run: ./src/Gui/scripts/verify.ps1 -Suite Engine

      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: artifacts/validation/
          retention-days: 14
