<!doctype html>
<!--
  PROTOTYPE — 一次性代码，不要合入 main。
  问题：Schedule Policy（定时策略）在每份任务配置标签页中应该长什么样？
  三个方案挂在同一个仿真主窗口里，用 ?variant=A|B|C 或底部切换条切换：
    A 稳妥：执行计划上方的可折叠“定时”面板，沿用 PlanItem 展开编辑模式
    B 效率：星期矩阵表格 + 一行快速新建 + 运行栏“定时队列”
    C 创新：一周时间轴，直接点击/拖动时间点
  数据只在内存中；模型与 PR #85 的 SchedulePolicy 一致（名称、启用、星期、多个分钟级时间点）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schedule UI Prototype</title>
<style>
:root {
  --canvas: #F6F8FB; --surface: #FFFFFF; --option: #F8FAFD; --disabled: #EEF2F6; --bar: #E9EDF3;
  --border: #D6DEE8; --border-subtle: #E4EAF0; --border-strong: #7B899B; --rail-border: #E3E8EF;
  --rail-active: #E6EDFA; --text: #182230; --body: #26313F; --secondary: #465467; --muted: #5F6E80;
  --primary: #3156A3; --primary-hover: #284A91; --primary-surface: #EDF3FF; --primary-surface-hover: #DCE8FC;
  --primary-border: #B8CCF4; --success: #26734D; --success-surface: #E7F5EC; --success-border: #A9D7BF;
  --warning: #8A5400; --warning-fg: #7A4700; --warning-surface: #FFF4E5; --warning-border: #F0C98A;
  --error: #B4232F; --error-surface: #FDEBED; --error-border: #E7AAB0; --error-fg: #9E1C2A;
  --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --mono: "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #C9D1DC; font: 13px/1.45 var(--font); color: var(--body); overflow: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
.ic { flex: none; display: block; }
.muted { color: var(--muted); }
.sec { color: var(--secondary); }

/* ---------- 仿真主窗口（宿主页面，三方案共用） ---------- */
.win { width: min(1320px, 100vw); min-width: 1120px; height: min(860px, 100vh); min-height: 700px; margin: 0 auto;
  background: var(--canvas); display: grid; grid-template-rows: 48px 1fr; box-shadow: 0 10px 40px #18223033; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; }
.titlebar .logo { width: 20px; height: 20px; border-radius: 5px; background: linear-gradient(135deg, #F08A24, #C2410C);
  color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.titlebar .name { font-size: 13px; color: var(--text); }
.titlebar .winbtns { margin-left: auto; display: flex; height: 100%; }
.titlebar .winbtns span { width: 46px; display: grid; place-items: center; color: var(--secondary); }
.body { display: grid; grid-template-columns: 64px 1fr; min-height: 0; }
.rail { border-right: 1px solid var(--rail-border); display: flex; flex-direction: column; padding: 6px 0 10px; gap: 2px; }
.rail .item { margin: 0 6px; height: 52px; border-radius: 6px; display: grid; place-items: center; align-content: center;
  gap: 2px; color: var(--secondary); font-size: 11px; position: relative; }
.rail .item.active { background: var(--rail-active); color: var(--primary); }
.rail .item.active::before { content: ""; position: absolute; left: -6px; top: 16px; bottom: 16px; width: 3px;
  border-radius: 2px; background: var(--primary); }
.rail .spacer { flex: 1; }
.home { display: grid; grid-template-columns: minmax(460px, 1fr) 392px; min-height: 0; }
.tasks { display: grid; grid-template-rows: 36px 1fr; padding: 12px 16px; min-height: 0; min-width: 0; }
.tasks-head { display: flex; align-items: center; gap: 16px; min-width: 0; }
.tasks-head h1 { font-size: 20px; font-weight: 600; color: var(--text); margin: 0; flex: none; }
.cfgbar { height: 34px; padding: 3px; border-radius: 8px; background: var(--bar); display: flex; gap: 2px;
  min-width: 0; overflow: hidden; }
.tab { height: 28px; padding: 0 10px 0 11px; border-radius: 6px; border: 1px solid transparent; background: transparent;
  color: var(--secondary); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab:hover { background: #FFFFFF8C; color: var(--text); }
.tab.sel { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px #18223024; }
.tab .badge { display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 400; color: var(--muted); }
.tab .badge.on { color: var(--primary); }
.tab .badge.off { opacity: .55; }
.tab .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.addtab { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 6px; display: grid;
  place-items: center; color: var(--secondary); flex: none; }
.ws { margin-top: 12px; min-height: 0; overflow: auto; padding-right: 8px; display: flex; flex-direction: column; gap: 12px; }

/* 执行计划（只读仿真） */
.plan-head { display: flex; align-items: center; height: 34px; }
.plan-head h2 { font-size: 15px; font-weight: 600; color: var(--text); margin: 0; }
.plan-head .count { margin-left: 8px; color: var(--muted); }
.plan-head .grow { flex: 1; }
.btn { height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
  display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--body); white-space: nowrap; }
.btn:hover { background: var(--option); border-color: var(--border-strong); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.subtle { border-color: transparent; background: transparent; font-weight: 400; color: var(--secondary); }
.btn.subtle:hover { background: var(--disabled); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.iconbtn { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted);
  display: grid; place-items: center; flex: none; }
.iconbtn:hover { background: var(--disabled); color: var(--text); }
.iconbtn.danger:hover { background: var(--error-surface); color: var(--error); }
.planitem { height: 44px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
  display: flex; align-items: center; gap: 10px; padding: 0 10px; margin-bottom: 8px; }
.planitem .grip { color: #A3AFBF; }
.planitem b { font-weight: 600; color: var(--text); }
.planitem .pre { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--disabled); color: var(--secondary); }
.plan-empty { padding: 16px 0; }
.plan-empty b { display: block; color: var(--text); }

/* 运行控制栏 */
.console { margin: 14px 16px 16px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 4px 18px #1822300F; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.rc { padding: 10px 12px 14px 16px; }
.rc-head { height: 32px; display: flex; align-items: center; gap: 10px; }
.rc-head b { font-size: 13px; color: var(--text); }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--secondary); }
.status i { width: 7px; height: 7px; border-radius: 50%; background: #A3AFBF; }
.status.run i { background: var(--success); } .status.prep i { background: #D08A16; } .status.err i { background: var(--error); }
.rc-head .grow { flex: 1; }
.rc-body { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.rc-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.rc-actions .btn { height: 36px; justify-content: center; }
.progress { height: 4px; border-radius: 2px; background: #E3E8EF; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--success); transition: width .4s; }
.nextline { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; background: var(--option);
  border: 1px solid var(--border-subtle); color: var(--secondary); font-size: 12px; }
.nextline b { color: var(--text); font-weight: 600; }
.nextline .grow { flex: 1; }
.nextline a { color: var(--primary); cursor: pointer; }
.csec { border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; min-height: 0; }
.csec.fill { flex: 1; }
.csec-head { height: 42px; margin: 0 8px 0 16px; display: flex; align-items: center; gap: 8px; }
.csec-head b { font-size: 13px; color: var(--text); }
.csec-head .grow { flex: 1; }
.feed { overflow: auto; padding: 0 16px 12px; min-height: 0; }
.feed .row { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 5px 0; font-size: 12px;
  border-bottom: 1px dashed var(--border-subtle); }
.feed .row time { font-family: var(--mono); color: var(--muted); font-size: 11px; padding-top: 1px; }
.feed .row.err span { color: var(--error-fg); } .feed .row.ok span { color: var(--success); }
.feed .row.skip span { color: var(--muted); }
.tag { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 4px; margin-right: 4px;
  background: var(--primary-surface); color: var(--primary); vertical-align: 1px; }
.feed-empty { text-align: center; color: var(--muted); padding: 40px 12px; }
.feed-empty b { display: block; color: var(--text); margin-bottom: 4px; font-size: 14px; }

/* 共用小控件 */
.sw { position: relative; width: 34px; height: 18px; flex: none; display: inline-block; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 9px; background: #fff; border: 1px solid var(--border-strong);
  transition: .15s; }
.sw span::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; top: 3px; left: 3px;
  background: var(--secondary); transition: .15s; }
.sw input:checked + span { background: var(--primary); border-color: var(--primary); }
.sw input:checked + span::after { left: 19px; background: #fff; }
.sw input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
.field-input { height: 32px; border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; background: #fff;
  outline: none; min-width: 0; }
.field-input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.days { display: flex; gap: 4px; }
.day { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: #fff;
  color: var(--secondary); display: grid; place-items: center; }
.day:hover { border-color: var(--border-strong); }
.day.on { background: var(--primary-surface); border-color: var(--primary-border); color: var(--primary); font-weight: 600; }
.chip { height: 28px; display: inline-flex; align-items: center; gap: 2px; padding: 0 4px 0 10px; border-radius: 14px;
  background: var(--primary-surface); border: 1px solid var(--primary-border); color: var(--primary);
  font-family: var(--mono); font-size: 12.5px; }
.chip button { width: 20px; height: 20px; border: 0; border-radius: 50%; background: transparent; color: inherit;
  display: grid; place-items: center; }
.chip button:hover { background: var(--primary-surface-hover); }
.link { border: 0; background: none; color: var(--primary); padding: 0 2px; font-size: 12px; }
.link:hover { text-decoration: underline; }
.warnbox { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-radius: 6px; font-size: 12px;
  background: var(--warning-surface); color: var(--warning-fg); border: 1px solid var(--warning-border); }
.warnbox.err { background: var(--error-surface); color: var(--error-fg); border-color: var(--error-border); }
.warnbox .ic { margin-top: 2px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--bar); gap: 2px; }
.seg button { height: 26px; padding: 0 12px; border: 0; border-radius: 5px; background: transparent; color: var(--secondary); }
.seg button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 3px #18223024; }

/* ---------- 方案 A：可折叠定时面板 ---------- */
.a-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.a-head { width: 100%; height: 44px; border: 0; background: transparent; display: flex; align-items: center; gap: 10px;
  padding: 0 12px; text-align: left; border-radius: 8px; }
.a-head:hover { background: var(--option); }
.a-head .t { font-weight: 600; color: var(--text); }
.a-head .summary { flex: 1; min-width: 0; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-head .next { color: var(--primary); font-size: 12px; white-space: nowrap; }
.a-head .next.skip { color: var(--warning-fg); }
.a-head .chev { color: var(--muted); transition: transform .15s; }
.a-card.open .a-head .chev { transform: rotate(180deg); }
.a-card.open .a-head { border-bottom: 1px solid var(--border-subtle); border-radius: 8px 8px 0 0; }
.a-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--option);
  border-radius: 0 0 8px 8px; }
.a-pol { border: 1px solid var(--border); border-radius: 6px; background: #fff; }
.a-pol.open { border-left: 3px solid var(--primary); }
.a-pol.off .a-main b, .a-pol.off .a-main span { color: var(--muted); }
.a-row { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; }
.a-main { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; display: flex; align-items: baseline;
  gap: 10px; padding: 6px 0; }
.a-main b { color: var(--text); font-weight: 600; white-space: nowrap; }
.a-main span { color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.a-editor { border-top: 1px solid var(--border-subtle); padding: 12px 14px 14px; display: grid;
  grid-template-columns: 56px 1fr; gap: 12px 12px; align-items: center; background: var(--option); }
.a-editor > label { font-size: 12px; font-weight: 600; color: var(--secondary); }
.a-editor .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.a-pol .warnbox { margin: 0 10px 10px; }
.a-foot { display: flex; align-items: center; gap: 12px; }
.a-foot .muted { font-size: 12px; }
.a-empty { text-align: center; padding: 14px 0 6px; color: var(--secondary); }
.a-empty b { display: block; color: var(--text); margin-bottom: 2px; }

/* ---------- 方案 B：矩阵表格 ---------- */
.b-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
.b-head { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--border-subtle); }
.b-head b { font-size: 14px; color: var(--text); }
.b-head .grow { flex: 1; }
.b-head .kbd { font-size: 11.5px; color: var(--muted); }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; background: #fff; color: var(--secondary); }
table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.grid th { height: 30px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-align: left; padding: 0 6px;
  background: var(--option); border-bottom: 1px solid var(--border-subtle); }
.grid th.d { text-align: center; padding: 0; }
.grid td { height: 38px; padding: 0 6px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
.grid tr.off td { background: #FBFCFD; }
.grid tr.off .cell-name, .grid tr.off .tok { color: var(--muted); }
.grid tr.warn td:first-child { box-shadow: inset 3px 0 0 #D08A16; }
.grid tr.group td { height: 30px; background: var(--canvas); font-size: 12px; font-weight: 600; color: var(--secondary); }
.grid tr.group td button { border: 0; background: none; color: var(--primary); font-weight: 600; padding: 0; }
.grid tr.group.cur td button { color: var(--text); }
.grid tr:hover td:not(.nohover) { background: #F9FBFE; }
.cell-name { width: 100%; height: 28px; border: 1px solid transparent; border-radius: 4px; background: transparent;
  padding: 0 6px; font-weight: 600; color: var(--text); outline: none; }
.cell-name:hover { border-color: var(--border); }
.cell-name:focus { border-color: var(--primary); background: #fff; }
.dc { width: 100%; height: 26px; border: 0; border-radius: 4px; background: transparent; display: grid; place-items: center; }
.dc i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); background: #fff; }
.dc.on i { background: var(--primary); border-color: var(--primary); }
.grid tr.off .dc.on i { background: #A3AFBF; border-color: #A3AFBF; }
.dc:hover i { border-color: var(--border-strong); }
.dc:focus-visible { outline: 2px solid var(--primary); }
.times-cell { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 28px; margin: 3px 0;
  border: 1px solid transparent; border-radius: 4px; padding: 1px 4px; cursor: text; }
.times-cell:focus-within { border-color: var(--primary); background: #fff; }
.tok { font-family: var(--mono); font-size: 12px; padding: 1px 5px; border-radius: 4px; background: var(--disabled);
  color: var(--body); white-space: nowrap; cursor: pointer; }
.tok:hover { background: var(--error-surface); color: var(--error-fg); text-decoration: line-through; }
.times-cell input { border: 0; outline: none; background: transparent; min-width: 50px; flex: 1; font-family: var(--mono);
  font-size: 12px; height: 24px; }
.next-cell { font-size: 12px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-cell.skip { color: var(--warning-fg); } .next-cell.never { color: var(--muted); }
.b-quick { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--option); }
.b-quick .field-input { flex: 1; font-size: 12.5px; }
.b-quick .hint { font-size: 11.5px; color: var(--muted); }
.b-preview { font-size: 12px; color: var(--primary); padding: 0 12px 10px; background: var(--option); margin-top: -4px; }
.b-preview.bad { color: var(--muted); }
.b-plan .planitem { height: 36px; }
.queue { overflow: auto; padding: 0 8px 8px; }
.qrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px;
  border-radius: 6px; font-size: 12px; cursor: pointer; }
.qrow:hover { background: var(--option); }
.qrow time { font-family: var(--mono); color: var(--text); font-size: 11.5px; }
.qrow .who b { color: var(--text); font-weight: 600; }
.qrow .who span { color: var(--muted); margin-left: 6px; }
.qrow.cur { background: var(--primary-surface); }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.pill.run { background: var(--success-surface); color: var(--success); }
.pill.skip { background: var(--disabled); color: var(--muted); }
.pill.bad { background: var(--error-surface); color: var(--error-fg); }
.qday { font-size: 11px; font-weight: 600; color: var(--muted); padding: 8px 8px 2px; }

/* ---------- 方案 C：一周时间轴 ---------- */
.c-top { display: flex; align-items: center; gap: 12px; }
.c-top .grow { flex: 1; }
.c-top label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--secondary); cursor: pointer; }
.c-hero { border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 18px;
  background: linear-gradient(120deg, #203F7E, #3156A3 60%, #4D72BF); color: #fff; }
.c-hero .lbl { font-size: 12px; opacity: .8; }
.c-hero .big { font-size: 28px; font-weight: 600; letter-spacing: .5px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.c-hero .sub { font-size: 12.5px; opacity: .9; }
.c-hero .grow { flex: 1; }
.c-hero .ring { width: 54px; height: 54px; flex: none; }
.c-hero.skip { background: linear-gradient(120deg, #6B4A12, #8A5400 60%, #A86C10); }
.c-hero.none { background: var(--surface); color: var(--secondary); border: 1px dashed var(--border); }
.c-hero.none .big { font-size: 16px; color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lg { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 6px 0 10px; border-radius: 15px;
  border: 1px solid var(--border); background: #fff; color: var(--body); }
.lg i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.lg.off i { background: transparent; border: 2px solid #A3AFBF; }
.lg.off { color: var(--muted); }
.lg.act { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); font-weight: 600; }
.lg .n { font-size: 11px; color: var(--muted); font-weight: 400; }
.tl { border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 6px 12px 10px 0; user-select: none; }
.tl-axis, .tl-row { display: grid; grid-template-columns: 66px 1fr; }
.tl-axis .ticks { position: relative; height: 20px; }
.tl-axis .ticks span { position: absolute; transform: translateX(-50%); font-size: 10.5px; color: var(--muted);
  font-family: var(--mono); top: 2px; }
.tl-row { height: 40px; }
.tl-day { border: 0; background: transparent; display: flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 12px; color: var(--secondary); border-radius: 6px; margin: 4px 6px 4px 4px; position: relative; white-space: nowrap; }
.tl-day:hover { background: var(--disabled); }
.tl-day.in { color: var(--c); font-weight: 700; }
.tl-day.in::before { content: ""; position: absolute; left: 3px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--c); }

<body>
<div id="app"></div>
<div class="drawer" id="drawer"></div>
<script>
// ---------------------------------------------------------------- 数据与工具
const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
const DAY_CN = { 0: '日', 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六' };
const DAY_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const WEEKDAYS = [1, 2, 3, 4, 5], WEEKEND = [6, 0], ALL = [1, 2, 3, 4, 5, 6, 0];
const COLORS = ['#3156A3', '#26734D', '#B26A00', '#0E7C86', '#7A3E9D', '#B4232F'];
const VARIANTS = { A: '稳妥：折叠面板', B: '效率：矩阵与队列', C: '创新：一周时间轴', D: '对比：左侧定时页' };
let seq = 100;
const nid = p => p + (++seq);

function initialState() {
  return {
    activeId: 'c1',
    configs: [
      { id: 'c1', name: '日常', pretask: '打开游戏', plan: ['批量领取', '忍术特训', '竞技场一键六道'], policies: [
        { id: 'p1', name: '工作日早晚', enabled: true, days: [1, 2, 3, 4, 5], times: ['08:00', '20:00'] },
        { id: 'p2', name: '周末上午', enabled: true, days: [6, 0], times: ['10:30'] } ] },
      { id: 'c2', name: '周末活动', pretask: '打开游戏', plan: ['购物节送礼', '注册并练级'], policies: [
        { id: 'p3', name: '活动场次', enabled: true, days: [6, 0], times: ['10:30', '21:00'] } ] },
      { id: 'c3', name: '小号', plan: [], policies: [
        { id: 'p4', name: '每天中午', enabled: true, days: ALL.slice(), times: ['12:00'] } ] },
      { id: 'c4', name: '配置 4', plan: ['批量领取'], policies: [
        { id: 'p5', name: '夜间', enabled: false, days: [1, 3, 5], times: ['23:30'] } ] },
    ],
  };
}
let S = initialState();
const params = new URLSearchParams(location.search);
const UI = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'D',
  aOpen: true, aExpanded: 'p1', bScope: 'config', bQuick: '', cMode: 'schedule', cActive: {}, cSel: null,
  cOthers: true, drawer: false, toast: null, dPage: 'schedule', dFocus: null,
  scnOpen: true, scnIdx: null, balloon: null, hl: null,
};
let offsetMs = 0;
const now = () => new Date(Date.now() + offsetMs);
const RT = { phase: 'idle', cfgId: null, policy: '', step: 0, total: 0, text: '' };
const LOG = [];

const cfg = () => S.configs.find(c => c.id === S.activeId);
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3);
const fromMin = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const sortDays = days => DAY_ORDER.filter(d => days.includes(d));
const normTimes = ts => [...new Set(ts)].sort();
const findPolicy = pid => {
  for (const c of S.configs) { const p = c.policies.find(x => x.id === pid); if (p) return [c, p]; }
  return [null, null];
};

function parseTime(s) {
  s = String(s).trim().replace(/：/g, ':');
  let m = s.match(/^(\d{1,2})(?::(\d{1,2}))?$/) || s.match(/^(\d{1,2})(\d{2})$/);
  let h, mi;
  if (m) { h = +m[1]; mi = m[2] ? +m[2] : 0; } else if ((m = s.match(/^(\d{1,2})点(?:(半)|(\d{1,2})分?)?$/))) {
    h = +m[1]; mi = m[2] ? 30 : m[3] ? +m[3] : 0;
  } else return null;
  return h < 24 && mi < 60 ? pad(h) + ':' + pad(mi) : null;
}
function daysText(days) {
  const d = sortDays(days), k = d.join();
  if (!d.length) return '未选星期';
  if (k === ALL.join()) return '每天';
  if (k === WEEKDAYS.join()) return '工作日';
  if (k === '6,0') return '周末';
  const idx = d.map(x => DAY_ORDER.indexOf(x));
  if (d.length >= 3 && idx.every((v, i) => !i || v === idx[i - 1] + 1)) return '周' + DAY_CN[d[0]] + '至周' + DAY_CN[d.at(-1)];
  return '周' + d.map(x => DAY_CN[x]).join('、');
}
const summary = p => daysText(p.days) + ' ' + (p.times.length ? p.times.join('、') : '未设时间');
const enabledPolicies = c => c.policies.filter(p => p.enabled);

// 未来 8 天内的到点机会，按分钟分组；同组内按配置列表顺序，第一份有效配置获准。
function occurrences(from = now(), span = 8) {
  const out = [], base = new Date(from); base.setHours(0, 0, 0, 0);
  for (let i = 0; i < span; i++) {
    const day = new Date(base); day.setDate(base.getDate() + i);
    const groups = new Map();
    S.configs.forEach((c, ci) => c.policies.forEach(p => {
      if (!p.enabled || !p.days.includes(day.getDay())) return;
      p.times.forEach(tm => {
        const t = new Date(day); t.setHours(+tm.slice(0, 2), +tm.slice(3), 0, 0);
        if (t <= from) return;
        if (!groups.has(+t)) groups.set(+t, { t, entries: [] });
        const g = groups.get(+t);
        let e = g.entries.find(x => x.cfg === c);
        if (!e) g.entries.push(e = { cfg: c, ci, policies: [] });
        if (!e.policies.includes(p)) e.policies.push(p);
      });
    }));
    for (const g of groups.values()) {
      g.entries.sort((a, b) => a.ci - b.ci);
      const w = g.entries.find(e => e.cfg.plan.length);
      g.winner = w ? w.cfg : null;
      out.push(g);
    }
  }
  return out.sort((a, b) => a.t - b.t);
}
function statusOf(g, c) { return g.winner === c ? 'run' : c.plan.length ? 'skip' : 'bad'; }
function nextFor(c, pol) {
  const g = occurrences().find(g => g.entries.some(e => e.cfg === c && (!pol || e.policies.includes(pol))));
  return g ? { g, status: statusOf(g, c) } : null;
}
function whenText(t) {
  const n = now(), a = new Date(n), b = new Date(t); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0);
  const d = Math.round((b - a) / 864e5);
  return (d === 0 ? '今天' : d === 1 ? '明天' : '周' + DAY_CN[t.getDay()]) + ' ' + hm(t);
}
function inText(t) {
  const m = Math.ceil((t - now()) / 6e4);
  if (m < 60) return m + ' 分钟后';
  if (m < 1440) return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分后';
  return Math.floor(m / 1440) + ' 天 ' + Math.floor(m % 1440 / 60) + ' 小时后';
}
// 与其他配置同刻到点的冲突（只看启用的策略）。
function conflicts(c, p) {
  if (!p.enabled) return [];
  const res = new Map(), ci = S.configs.indexOf(c);
  S.configs.forEach((o, oi) => {
    if (o === c) return;
    o.policies.forEach(op => {
      if (!op.enabled) return;
      const days = p.days.filter(d => op.days.includes(d)), times = p.times.filter(t => op.times.includes(t));
      if (!days.length || !times.length) return;
      const key = o.id + times.join();
      const cur = res.get(key) || { other: o, first: oi < ci ? o : c, days: new Set(), times };
      days.forEach(d => cur.days.add(d)); res.set(key, cur);
    });
  });
  return [...res.values()].map(r => ({ ...r, days: [...r.days] }));
}
function issues(c, p) {
  const list = [];
  if (!p.days.length) list.push({ err: false, text: '未选星期，不会运行。' });
  else if (!p.times.length) list.push({ err: false, text: '未设时间，不会运行。' });
  if (p.enabled && !c.plan.length) list.push({ err: true, text: '执行计划为空，到点时无法运行。' });
  for (const k of conflicts(c, p)) {
    const lose = k.first !== c;
    list.push({ err: false, text: `${daysText(k.days)} ${k.times.join('、')} 与「${k.other.name}」同时到点，` +
      (lose ? '本配置将跳过。' : `「${k.other.name}」将跳过。`) });
  }
  return list;
}

// ---------------------------------------------------------------- 修改（对应 PR #85 的 Add/Update/Delete）
function addPolicy(c, init = {}) {
  const p = Object.assign({ id: nid('p'), name: '定时 ' + (c.policies.length + 1), enabled: true,
    days: WEEKDAYS.slice(), times: ['08:00'] }, init);
  p.days = sortDays(p.days); p.times = normTimes(p.times);
  c.policies.push(p); return p;
}
function delPolicy(pid) {
  const [c, p] = findPolicy(pid); if (!c) return;
  c.policies = c.policies.filter(x => x !== p);
}
function toggleDay(p, d) { p.days = p.days.includes(d) ? p.days.filter(x => x !== d) : sortDays([...p.days, d]); }
function addTimes(p, list) {
  const ok = list.filter(Boolean);
  p.times = normTimes([...p.times, ...ok]);
  return ok.length;
}
function setDays(p, which) { p.days = { wd: WEEKDAYS, we: [6, 0], all: ALL }[which].slice(); }

function parseQuick(str) {
  const days = new Set(), times = [], rest = [];
  const CH = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 0, 天: 0 };
  for (const tok of str.split(/[\s,，、]+/).filter(Boolean)) {
    const t = parseTime(tok);
    if (t) { times.push(t); continue; }
    if (tok === '工作日') { WEEKDAYS.forEach(d => days.add(d)); continue; }
    if (tok === '周末') { WEEKEND.forEach(d => days.add(d)); continue; }
    if (/^(每天|每日|天天)$/.test(tok)) { ALL.forEach(d => days.add(d)); continue; }
    const m = tok.match(/^(?:周|星期|礼拜)([一二三四五六日天至到~\-]+)$/);
    if (m) {
      const r = m[1].match(/^([一二三四五六日天])[至到~\-]周?([一二三四五六日天])$/);
      if (r) {
        const a = DAY_ORDER.indexOf(CH[r[1]]), b = DAY_ORDER.indexOf(CH[r[2]]);
        for (let i = a; i <= b; i++) days.add(DAY_ORDER[i]);
      } else [...m[1]].forEach(ch => CH[ch] !== undefined && days.add(CH[ch]));
      continue;
    }
    rest.push(tok);
  }
  return { days: [...days], times, name: rest.join(' ') };
}

function bindTimeline() {

// ---------------------------------------------------------------- 模拟到点（共用宿主行为，参照 Spec #80）
const stamp = () => { const d = now(); return hm(d) + ':' + pad(d.getSeconds()); };
function log(text, kind, tag = '定时') { LOG.unshift({ time: stamp(), text, kind, tag }); }
let timers = [];
function simulate() {
  if (RT.phase === 'prep' || RT.phase === 'run') {
    const g = occurrences()[0];
    if (g) { offsetMs += g.t - now() + 42e3; g.entries.forEach(e => log(`跳过「${e.cfg.name}」：正在运行其他任务`, 'skip')); }
    render(); return;
  }
  const g = occurrences()[0];
  if (!g) { toast('没有启用且会触发的定时'); return; }
  offsetMs += g.t - now() + 42e3;
  let winner = null;
  for (const e of g.entries) {
    const pn = e.policies.map(p => p.name).join('、');
    if (winner) { log(`跳过「${e.cfg.name}」：与「${winner.name}」同时到点`, 'skip'); continue; }
    if (!e.cfg.plan.length) {
      log(`「${e.cfg.name}」未能启动：执行计划为空`, 'err');
      UI.balloon = { title: '定时任务未能启动', msg: `「${e.cfg.name}」：执行计划为空`, failed: true }; continue;
    }
    winner = e.cfg; log(`启动「${e.cfg.name}」（${pn} ${hm(g.t)}）`);
    RT.policy = pn;
  }
  if (!winner) { render(); return; }
  const prevTab = S.activeId;
  S.activeId = winner.id;
  Object.assign(RT, { phase: 'prep', cfgId: winner.id, step: 0, total: winner.plan.length, text: '正在关闭旧的桌面分身…' });
  render();
  timers.forEach(clearTimeout); timers = [];
  const at = (ms, fn) => timers.push(setTimeout(() => { fn(); render(); }, ms));
  at(1100, () => { RT.text = '正在启动桌面分身…'; log('已关闭旧的桌面分身'); });
  at(2200, () => { RT.phase = 'run'; RT.text = `${winner.pretask || '启动阶段'} → ${winner.plan[0]}`; });
  winner.plan.forEach((t, i) => at(3200 + i * 1100, () => { RT.step = i + 1; RT.text = winner.plan[i + 1] || '收尾中'; log(`完成「${t}」`, 'ok', ''); }));

  });

    } },
  { g: '到点后 · 首页运行动态 + 通知', name: '任务执行失败', where: '运行动态 + 通知 + 胶囊', page: 'home', hl: '.feed .row:nth-child(-n+2)',
    note: '成功和失败通知的标题都带配置名，手动运行也一样。',
    apply() {
      ranOk('20:00', C('c1'), '工作日早晚'); addLog('20:01:10', '完成「批量领取」', 'ok', '');
      addLog('20:03:31', '「忍术特训」失败：未找到目标界面', 'err', '');
      addLog('20:03:31', '已保留桌面分身，可打开查看现场', 'err');
      Object.assign(RT, { phase: 'fail', cfgId: 'c1' });

    } },
  { g: '到点后 · 首页运行动态 + 通知', name: '手动停止', where: '运行动态（不通知）', page: 'home', hl: '.feed .row:first-child',
    apply() {

    } },
  { g: '到点后 · 首页运行动态 + 通知', name: '运行未能确认结束', where: '通知（现有）', page: 'home', hl: '.status',
    apply() {

  { g: '状态 · 定时页', name: '横条：没有启用的定时', where: '顶部横条 + 列表', hl: '.c-hero, .d-cfg .st',

];
function renderScenarios() {
  let html = '', last = '';
  SCENARIOS.forEach((sc, i) => {
    if (sc.g !== last) { html += `<h4>${sc.g}</h4>`; last = sc.g; }
    html += `<button class="it ${UI.scnIdx === i ? 'on' : ''}" data-act="scn" data-i="${i}">${sc.name}` +
      `${sc.q ? `<span class="q">问题${sc.q}</span>` : ''}<small>${sc.where}</small></button>`;
    if (UI.scnIdx === i && sc.note) html += `<div class="note">${esc(sc.note)}</div>`;
  });
  return `<div class="scn"><div class="hd"><span>提示场景</span><small>↑ ↓ 切换</small></div>${html}</div>`;
}
function applyScenario(i) {
  const sc = SCENARIOS[i];
  S = initialState(); LOG.length = 0; timers.forEach(clearTimeout); timers = []; offsetMs = 0;
  Object.assign(RT, { phase: 'idle', cfgId: null, label: '', text: '', step: 0, total: 0 });
  Object.assign(UI, { variant: 'D', dPage: sc.page || 'schedule', dFocus: 'c1', cActive: {}, cSel: null, balloon: null,
    hl: sc.hl, scnIdx: i, toast: null });
  sc.apply();
  if (sc.page === 'home') S.activeId = RT.cfgId || 'c1';
  const u = new URL(location.href); u.searchParams.set('variant', 'D'); history.replaceState(null, '', u);
  render();
}

// ---------------------------------------------------------------- 事件
let toastTimer;
function toast(msg) { UI.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { UI.toast = null; render(); }, 3200); }
function setVariant(v) {
  UI.variant = v; UI.cSel = null;
  const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  render();
}
function cycle(step) { const k = Object.keys(VARIANTS); setVariant(k[(k.indexOf(UI.variant) + step + k.length) % k.length]); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, pid, cfg: cid, d, t, w } = el.dataset;
  const [pc, p] = pid ? findPolicy(pid) : [null, null];
  if (act !== 'scn' && act !== 'scnpanel') UI.hl = null;
  switch (act) {
    case 'scn': return applyScenario(+el.dataset.i);
    case 'scnpanel': UI.scnOpen = !UI.scnOpen; break;
    case 'balloonx': UI.balloon = null; break;
    case 'prev': return cycle(-1);
    case 'next': return cycle(1);
    case 'drawer': UI.drawer = !UI.drawer; break;
    case 'reset': S = initialState(); offsetMs = 0; LOG.length = 0; timers.forEach(clearTimeout);
      Object.assign(RT, { phase: 'idle', cfgId: null, label: '' }); UI.cSel = null; UI.balloon = null; UI.scnIdx = null; UI.aExpanded = 'p1'; toast('已重置原型数据'); break;
    case 'simulate': return simulate();
    case 'clearlog': LOG.length = 0; break;
    case 'tab': case 'goto': S.activeId = cid; UI.cSel = null; break;
    case 'a-toggle': UI.aOpen = !UI.aOpen; break;
    case 'a-expand': UI.aExpanded = UI.aExpanded === pid ? null : pid; break;
    case 'a-new': { const np = addPolicy(cfg()); UI.aExpanded = np.id; toast('已新建：工作日 08:00，启用'); break; }
    case 'delpolicy': delPolicy(pid); UI.cSel = null; break;
    case 'day': toggleDay(p, +d); break;
    case 'setdays': setDays(p, w); break;
    case 'deltime': p.times = p.times.filter(x => x !== t); if (UI.cSel?.t === t) UI.cSel = null; break;
    case 'addtime': {
      const inp = document.querySelector(`[data-enter="addtime"][data-pid="${pid}"]`);
      if (!addTimes(p, [parseTime(inp.value)])) { toast('先选择一个时间'); return render(); }
      break;
    }
    case 'focustimes': if (e.target === el) el.querySelector('input').focus(); return;
    case 'bscope': UI.bScope = el.dataset.s; break;
    case 'bpreset': UI.bQuick = el.dataset.v; break;
    case 'cmode': UI.cMode = el.dataset.m; break;
    case 'cactive': UI.cActive[tlCfg().id] = pid; UI.cSel = null; break;
    case 'dpage': UI.dPage = el.dataset.p; UI.cSel = null; break;
    case 'dfocus': UI.dFocus = cid; UI.cSel = null; break;
    case 'cnew': { const np = addPolicy(tlCfg()); UI.cActive[tlCfg().id] = np.id; UI.cSel = { pid: np.id, t: '08:00' }; break; }
    case 'cday': {
      const ap = activeC(tlCfg());
      if (!ap) { toast('先点击时间轴创建一条定时'); return render(); }
      toggleDay(ap, +d); break;
    }
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.change;
  if (!k) return;
  if (k === 'cothers') { UI.cOthers = el.checked; return render(); }
  const [, p] = findPolicy(el.dataset.pid);
  if (k === 'enabled') p.enabled = el.checked;
  if (k === 'name') { const v = el.value.trim(); if (v) p.name = v; }
  if (k === 'ctime') {
    const nt = parseTime(el.value);
    if (nt) { p.times = normTimes(p.times.filter(x => x !== el.dataset.t).concat(nt)); UI.cSel = { pid: p.id, t: nt }; }
  }
  render();
});
const onQuick = e => {
  if (e.target.dataset.input !== 'bquick' || e.isComposing) return;
  UI.bQuick = e.target.value; render();
};
document.addEventListener('input', onQuick);
document.addEventListener('compositionend', onQuick);
document.addEventListener('keydown', e => {
  const el = e.target, k = el.dataset?.enter;
  if (k && e.key === 'Enter') {
    e.preventDefault();
    const [, p] = el.dataset.pid ? findPolicy(el.dataset.pid) : [null, null];
    if (k === 'addtime') { if (addTimes(p, [parseTime(el.value)])) { el.value = ''; render(); } return; }
    if (k === 'btimes') {
      const parts = el.value.split(/[\s,，、]+/).filter(Boolean), ok = parts.map(parseTime);
      if (ok.some(x => !x)) toast('无法识别：' + parts.filter((_, i) => !ok[i]).join(' '));
      addTimes(p, ok); el.value = ''; return render();
    }
    if (k === 'bquick') {
      const q = parseQuick(UI.bQuick);
      if (!q.days.length && !q.times.length) return toast('未识别星期或时间'), render();
      const c = cfg(), np = addPolicy(c, { days: q.days.length ? q.days : WEEKDAYS, times: q.times.length ? q.times : ['08:00'] });
      np.name = q.name || daysText(np.days);
      UI.bQuick = ''; toast(`已新建「${np.name}」：${summary(np)}`); return render();
    }
  }
  if (k === 'btimes' && e.key === 'Backspace' && !el.value) {
    const [, p] = findPolicy(el.dataset.pid); p.times = p.times.slice(0, -1); return render();
  }
  if (el.matches('input, textarea, [contenteditable]')) {
    if (e.key === 'Enter' && el.dataset.change === 'name') el.blur();
    return;
  }
  if (UI.scnOpen && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    const n = SCENARIOS.length, cur = UI.scnIdx ?? -1;
    return applyScenario(((e.key === 'ArrowDown' ? cur + 1 : cur - 1) + n) % n);
  }
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
setInterval(() => { if (!document.activeElement || document.activeElement === document.body) render(); }, 30000);
render();
